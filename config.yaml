data:
  main: Data/batches/batch_0.csv
  bureau: Data/batches/bureau.csv
  bb: Data/batches/bureau_balance.csv

model:
  objective: binary
  metric: auc
  boosting_type: gbdt

  # core params
  learning_rate: 0.01
  num_leaves: 63
  max_depth: -1
  min_child_samples: 20
  max_bin: 255

  # sampling
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.6

  # regularization
  reg_alpha: 0.1
  reg_lambda: 0.1
  min_split_gain: 0.02

  # reproducibility
  random_state: 42

  # system
  verbosity: -1
  n_jobs: -1

training:
  n_estimators: 10000
  n_folds: 5
  early_stopping_rounds: 200
  log_freq: 500
  random_state: 42 # controls StratifiedKFold shuffle

calibration:
  use: true
  method: sigmoid
  cv: 2

threshold:
  min: 0.1
  max: 0.9
  steps: 50

business:
  loan_amt: 10000
  profit_amt: 2000
